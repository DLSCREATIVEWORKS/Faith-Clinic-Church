name: Build and publish to deploy branch

# Compiles the site on GitHub, then publishes the finished build to the
# "deploy" branch. SiteGround runs that branch and never compiles anything.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Placeholders only. The build does not connect to the database.
          DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
          PAYLOAD_SECRET: build-time-placeholder
      - name: Publish build to deploy branch
        run: node scripts/prepare-deploy.mjs && bash scripts/publish-deploy.sh
